[project]
name = "notion-webclip-summarizer"
version = "0.1.0"
description = "Summarize Notion web clips and export them to Obsidian"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<1", "litellm>=1.80,<2", "tenacity>=9,<10", "python-dotenv>=1,<2", "PyYAML>=6,<7", "tzdata>=2025.2"]

[project.scripts]
webclip-summarizer = "webclip_summarizer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.ruff]
line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["src/webclip_summarizer"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
